         en el HTML servido los inyecta scripts/prerender.mjs por URL -->

    <!-- Google Fonts — async to avoid render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" onload="this.rel='stylesheet'">

    <!-- Background image — tell the browser to fetch it early -->

    <!-- Consent Mode v2 — TIENE que ir antes que AdSense y que Analytics.
         Google exige una señal de consentimiento para servir anuncios en el
         EEE; sin ella limita o bloquea la publicidad y expone la cuenta a
         sanción, por muy aprobado que esté el sitio. Por defecto todo
         DENEGADO: la ley pide que se deniegue hasta que el usuario elija, y
         CookieBanner lo levanta con gtag('consent','update') (ver
         src/lib/consent.js). wait_for_update le da 500 ms a esa decisión
         antes de dar por buena la denegación.
         requestNonPersonalizedAds: mientras no haya permiso explícito los
         anuncios se piden SIN personalizar — que es además lo que toca en un
         sitio con público menor de edad. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      (window.adsbygoogle = window.adsbygoogle || []).requestNonPersonalizedAds = 1;
    </script>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9281841187642423" crossorigin="anonymous"></script>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2JYFB6HNHF"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-2JYFB6HNHF');
